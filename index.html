<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="glow" id="glow" aria-hidden="true"></div>

<header class="nav" id="nav">
  <a href="#home" class="logo" id="logo">Portfolio</a>
  <nav id="navlinks" aria-label="Sections"></nav>
  <button class="burger" id="burger" aria-label="Menu"><span></span><span></span></button>
</header>

<main>
  <section id="home" class="sec hero"><div class="wrap" id="home-in"></div></section>
  <section id="about" class="sec" hidden><div class="wrap" id="about-in"></div></section>
  <section id="skills" class="sec" hidden><div class="wrap" id="skills-in"></div></section>
  <section id="services" class="sec" hidden><div class="wrap" id="services-in"></div></section>
  <section id="projects" class="sec" hidden><div class="wrap" id="projects-in"></div></section>
  <section id="experience" class="sec" hidden><div class="wrap" id="experience-in"></div></section>
  <section id="learning" class="sec" hidden><div class="wrap" id="learning-in"></div></section>
  <section id="contact" class="sec" hidden><div class="wrap" id="contact-in"></div></section>
</main>

<footer class="foot"><div class="wrap" id="foot-in"></div></footer>

<button class="fab" id="fab" hidden>Edit site</button>
<aside class="panel" id="panel" aria-label="Admin panel"></aside>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="script.js"></script>
</body>
</html>
